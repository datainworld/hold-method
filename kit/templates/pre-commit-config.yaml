# HOLD 커밋 전 검사 (pre-commit). 설치: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: hold-check-views
        name: HOLD 산출물·필수 뷰 검사 (R05·R06)
        entry: python scripts/check_views.py
        language: system
        pass_filenames: false
        always_run: true
      - id: hold-gen-views
        name: HOLD 사실 뷰 최신성 검사
        entry: python scripts/gen_views.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: hold-contract-golden
        name: 계약·골든 테스트 (R04, 테스트가 아직 없으면 통과)
        entry: python -c "import subprocess,sys; r=subprocess.call([sys.executable,'-m','pytest','tests/contracts','tests/golden','-q']); sys.exit(0 if r in (0,5) else r)"
        language: system
        pass_filenames: false
        always_run: true
      - id: hold-lint-imports
        name: 모듈 경계 검사 (R02)
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
      # 웹 확장 (9장). hold.toml 의 [web].enabled = false 이면 두 검사 모두 바로 통과합니다.
      - id: hold-web-pinned
        name: 웹 확장 고정 버전 검사 (R17)
        entry: python scripts/hold_web_sync.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: hold-web-legacy-scan
        name: 웹 확장 레거시 패턴 검사 (R15, block 모드에서만 실패)
        entry: python scripts/web_scan.py
        language: system
        pass_filenames: true
        files: \.(html?|css|[mc]?js|jsx|tsx?|vue|svelte)$
